<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />
    <title>Penalty Kings</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <canvas id="game" aria-label="3D penalty shootout scene"></canvas>

    <!-- UI layer: real HTML/CSS above the canvas -->
    <div id="ui">
      <section id="loading" role="status" aria-live="polite">
        <h1 class="loading__title">Penalty Kings</h1>
        <div class="loading__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="loading__fill"></div>
        </div>
        <p class="loading__label">Preparing…</p>
        <p class="loading__error" hidden></p>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
